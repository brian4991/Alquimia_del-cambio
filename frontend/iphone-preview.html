<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Aperçu iPhone · Nicole Ramírez</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; padding: 20px 16px; color: #30352c; background: #e9e7e1; font: 14px/1.5 system-ui, sans-serif; }
    header { text-align: center; margin-bottom: 16px; }
    h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
    header a { color: #515b42; text-underline-offset: 3px; display: inline-flex; min-height: 28px; align-items: center; }
    a:focus-visible, iframe:focus-visible { outline: 3px solid #59614c; outline-offset: 4px; }
    .stage { position: relative; margin: auto; }
    .iphone { position: absolute; width: 418px; height: 872px; padding: 12px; border: 2px solid #63635f; border-radius: 58px; background: #181918; box-shadow: 0 22px 50px -18px #18191860, inset 0 0 0 2px #393a36; transform-origin: top left; }
    .iphone::before, .iphone::after { content: ''; position: absolute; background: #42433f; width: 3px; border-radius: 3px; }
    .iphone::before { left: -5px; top: 164px; height: 82px; }
    .iphone::after { right: -5px; top: 192px; height: 65px; }
    .screen { width: 390px; height: 844px; border-radius: 44px; overflow: hidden; background: #f9f8f6; display: grid; grid-template-rows: 52px minmax(0, 1fr) 64px; }
    .status { position: relative; display: flex; align-items: center; justify-content: space-between; padding: 3px 28px 0; color: #20231e; font-size: 15px; font-weight: 600; }
    .island { position: absolute; width: 114px; height: 31px; left: 138px; top: 9px; border-radius: 24px; background: #101110; }
    .island::after { content: ''; position: absolute; right: 10px; top: 10px; width: 10px; height: 10px; border-radius: 50%; background: #171e25; }
    .status svg { width: 68px; height: 16px; }
    iframe { display: block; width: 100%; height: 100%; min-height: 0; border: 0; background: #f9f8f6; }
    .safari { padding: 9px 24px 0; border-top: 1px solid #dcded5; background: #f5f4f0; }
    .address { height: 32px; border-radius: 10px; display: flex; justify-content: center; align-items: center; background: #e4e4de; color: #50564a; font-size: 13px; }
    .home-indicator { width: 134px; height: 5px; border-radius: 8px; margin: 10px auto 0; background: #20231e; }
  </style>
</head>
<body>
  <header><h1>Aperçu iPhone · page interactive</h1><a href="/" target="_blank" rel="noopener">Ouvrir sans le cadre</a></header>
  <main class="stage" aria-label="Simulation visuelle d’un iPhone">
    <div class="iphone">
      <div class="screen">
        <div class="status" aria-hidden="true"><span>9:41</span><span class="island"></span><svg viewBox="0 0 68 16" fill="currentColor"><path d="M1 12h3v3H1zm5-3h3v6H6zm5-3h3v9h-3zm5-4h3v13h-3z"/><path d="M25 6a11 11 0 0 1 16 0l-2 2a8 8 0 0 0-12 0zm4 4a5.5 5.5 0 0 1 8 0l-2 2a3 3 0 0 0-4 0zm3 3h2v2h-2z"/><rect x="46" y="3" width="18" height="11" rx="3" fill="none" stroke="currentColor"/><rect x="48" y="5" width="14" height="7" rx="1"/><path d="M65 6h2v5h-2z"/></svg></div>
        <iframe src="/" title="Landing de Nicole Ramírez — aperçu téléphone"></iframe>
        <div class="safari" aria-hidden="true"><div class="address">localhost</div><div class="home-indicator"></div></div>
      </div>
    </div>
  </main>
  <script>
    const stage = document.querySelector('.stage');
    const phone = document.querySelector('.iphone');
    function fitPhone() {
      const availableHeight = Math.max(240, window.innerHeight - stage.offsetTop - 24);
      const scale = Math.min(1, (window.innerWidth - 40) / 418, availableHeight / 872);
      stage.style.width = `${418 * scale}px`;
      stage.style.height = `${872 * scale}px`;
      phone.style.transform = `scale(${scale})`;
    }
    fitPhone();
    window.addEventListener('resize', fitPhone);
    // Booking pages open normally rather than inside the visual device frame.
    document.querySelector('iframe').addEventListener('load', event => {
      try {
        event.target.contentDocument.addEventListener('click', click => {
          const link = click.target.closest('a[href]');
          if (link && new URL(link.href).origin !== location.origin) {
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
          }
        });
      } catch { /* A cross-origin destination manages its own navigation. */ }
    });
  </script>
</body>
</html>
